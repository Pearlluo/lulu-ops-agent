    logic:
      schedule: 5-phase incremental pipeline (Azure Function timer), state in blob timesheethour/config/pipeline_state.json
      matching:
      - 'Phase 3 merge: OPMS timesheet LEFT JOIN OPMS roster on (EmployeeID, Date) attaching the resource_request
        project string'
      - 'Phase 4 client resolve (THE OPMS<->BMS ProjectID bridge): manual Project_Client_Map.csv exact match first;
        else job-code prefix regex ^([A-Z]{2,4}-\d{4,6}) (''SH-25006 - July FPS'' -> ''SH-25006'') -> JMS-Jobs.JobID
        -> ProjectLookupId -> JMS-Projects.ATitle (= client code ''C0002-Newmont'')'
      - 'Phase 5 rates: JMS-Rates keyed (ProjectID, Position via PPL-Positions title, DS/NS); project-specific rate
        first, else position default rate'
      rules:
      - 'Shift classification: WorkType ''NIGHT SHIFT'' or ending '' AM'' (FLY IN AM / DRIVE OUT AM...) -> NS, else
        DS'
      - 'Incremental: only (EmployeeID, Date) keys new in this run are re-merged; rows with UnitRate already set
        are skipped'
      outputs: blob timesheethour/data/merged.parquet (consumed by Timesheet_Search_Portal)
      ported_to_lake: Gold project_bridge + client_name columns on roster_summary / weekly_timesheet (build_silver_gold.py:_make_client_resolver,
        same CSV-first-then-prefix order)
