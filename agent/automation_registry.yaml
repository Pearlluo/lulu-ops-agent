      latest_run:
        workflow: Build and deploy Python app to Azure Web App - quote-labour-hire
        title: Add 3-tier ORD/OT/DT pay rates, RR Schedule PDF, redesign Shift Types
        status: completed
        conclusion: success
        updated_at: '2026-06-08T05:21:51Z'
        url: https://github.com/yourorg/acme_labour_hire_quote/actions/runs/27117620529
    logic:
      matching:
      - JMS-Jobs.ProjectLookupId -> JMS-Projects (client code = ATitle); JMS-Projects.ClientLookupId -> JMS-Clients
      - Rates from JMS-Rates keyed project+position (DayShift/NightShift), manually overridable per role
      - Quote files detected by name 'QT-*' containing job_id in IMS 01 Acme Contracts folders
      rules:
      - 'Tier split per role/day: std=min(hrs,8), ot=min(hrs-8,3), dt=remainder (defaults; configurable)'
      - 'Day type: WA public holiday table -> ph (flat rate on all hours); Sat/Sun -> weekend rates (blank = $0,
        no weekday fallback); else weekday'
      - client_charge = cost * multiplier (default 1.35); markup = client_labour - base_labour; GST 10%
      - Z.* positions priced as P&E (plant), others as Labour
      write_backs: Excel quote uploaded to IMS Operations '01 Acme Contracts/{client}/{job}/00 Commercial (Secured)/01
        Client Quotes'; quote index in blob acme-online-quote/quotes.json
