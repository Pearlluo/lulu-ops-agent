        url: https://github.com/yourorg/acme_weeklytimesheet_automation/actions/runs/27185542359
    logic:
      schedule: Azure Function timer, weekly, processes the last full Mon-Sun week (Perth dates)
      matching:
      - 'Step 1: OPMS /timesheets/entries hours summed per (employee_id, Perth date) REPLACE PPL-Rosters.Hours matched
        on (OPMS id, Date_x0020_From); no OPMS match -> row untouched'
      - 'Step 2 gap pairing from PPL-Timesheets: each ''Sign Out'' paired with next ''Sign In'' per OPMS; reversed
        pairs ignored; cross-day pairs > 6h ignored; gaps split per day at midnight'
      - 'Supplier backfill (ExtraUpdateSupplier): PPL-People.SupplierLookupId -> PPL-Rosters matched by normalized
        OPMS (''6.0''==''6''), only rows from last 9 days, never overwrites existing supplier'
      rules:
      - ActualHours = max(0, RosterHours - GapHours)
      - Z.* positions at site TRANSPORT & HIRE are plant/assets, excluded from the people report
      - 'ShiftType: WorkType ''NIGHT SHIFT'' -> NS, else DS; weekly Excel report per person 7-day DS/NS matrix,
        people with GrandTotal <= 0 dropped; emailed to Planning Team'
      ported_to_lake: Gold weekly_timesheet (build_silver_gold.py:build_weekly_timesheet) — same formula, computed
        straight from Bronze OPMS + BMS so it works even if the write-back lags
