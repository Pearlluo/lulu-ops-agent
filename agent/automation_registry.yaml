# ---- Power Automate cloud flows (hand-extracted from live definitions 2026-07-29) ----
# Enumerated via flow API from both environments (Acme Resources default + BMS).
# These are BUSINESS LOGIC records for RAG — flow JSON lives in Power Automate itself.
power_automate_flows:
  site_api_opms_update_ppl_rosters:
    display_name: Site-API-OPMS-UpdatePPLRosters
    state: Started
    schedule: Weekly Tuesday 02:00 AWST
    business:
      description: Master roster sync - pulls every employee's OPMS roster and rebuilds
        the PPL-Rosters SharePoint list (per-day rows) that Supervisor Portal and the
        BMS reporting stack read.
      keywords: [roster, PPL-Rosters, supervisor portal, 排班]
    logic:
      steps:
      - OPMS auth token -> GET /employee/all -> per employee GET /roster for the window
      - Rostered days with resource_request_allocations -> project text from first allocation
      - Site derived from project-code prefix rules (e.g. TH- -> Transport & Hire), validated
        against the Sites list (929365cc)
      - Missing day-rows created in PPL-Rosters (bec15b46); a cleanup loop deletes stale rows
      notes: PPL-Rosters is the per-day roster source of truth for the portal; Hours=0 rows
        can appear here (known quirk consumed downstream by LuLu).
  distinct_ppl_rosters_data:
    display_name: Distinct PPL-Rosters Data
    state: Started
    schedule: Daily 04:00 AWST
    business:
      description: Dedupes the PPL-Rosters list daily over a rolling window (14 days back
        to tomorrow) so double-created roster rows do not double count.
      keywords: [roster, dedupe, PPL-Rosters]
    logic:
      steps:
      - Key = lower(trim(concat(OPMS id + date + project fields)))
      - First occurrence kept (appended to seen array); duplicate rows deleted from the list
  jms_rates_update:
    display_name: JMS-Rates-update
    state: Started
    schedule: Daily
    business:
      description: Refreshes JMS-Rates rows (31ac4d9f) with the correct charge/pay rates -
        project-specific rates when the item is linked to a project, otherwise position
        default rates.
      keywords: [rates, JMS-Rates, charge rate, 费率]
    logic:
      steps:
      - For each JMS-Rates item resolve ProjectID from the Project lookup
      - Linked to project -> rates read from project-rates list (87dc45bc)
      - No project -> default rates from Positions list (fa1724a9)
      - PatchItem writes the resolved rates back onto the JMS-Rates row
  update_xerocc:
    display_name: Update XeroCC
    state: Started
    schedule: Daily 02:00 UTC
    business:
      description: Copies the Xero cost-centre/tracking code from JMS-Projects (02b62491)
        onto each JMS-Rates row so invoicing exports carry the right Xero coding.
      keywords: [Xero, cost centre, JMS-Projects, invoicing]
    logic:
      steps:
      - For each JMS-Rates item look up its project in JMS-Projects
      - If found, PatchItem writes the Xero CC fields onto the JMS-Rates row
  ranking_flow_updated:
    display_name: Ranking Flow Updated
    state: Started
    schedule: Daily 02:00 UTC
    business:
      description: Computes each worker's average performance ranking from supervisor
        ranking transactions and maintains the consolidated Ranking list (00000000).
      keywords: [ranking, worker ranking, performance, 评分]
    logic:
      steps:
      - Read RankingTX transactions (00000000); keep rows with non-empty RankingData
      - Per person map to OPMS id via lookup list (00000000)
      - RankingData is comma-separated scores -> average formatted to 2dp
      - Consolidated row written to Ranking list; stale duplicate rows deleted
      notes: Feeds gold worker_ranking via the LuLu pipeline; get_worker_ranking is
        HR_Manager/Admin_IT-gated in tool_policies.
  ranking_data_opms:
    display_name: Ranking Data OPMS
    state: Started
    schedule: Daily 02:00 UTC
    business:
      description: Pushes the consolidated average ranking from the Ranking list back
        into OPMS employee records (PATCH /employee/{id}).
      keywords: [ranking, OPMS, writeback]
    logic:
      steps:
      - OPMS auth token -> for each Ranking row PATCH api.opms.com.au/employee/{OPMS id}
      notes: The only FLOW that writes into OPMS. LuLu's governed submit_worker_rating
        tool writes a PPL-RankingTX transaction (source of truth) and immediately pushes
        the same recomputed average to OPMS, so this flow's nightly run is idempotent
        with LuLu-submitted ratings.
  update_recent_positions_from_opms:
    display_name: Update recent positions from OPMS
    state: Stopped
    schedule: (was) Daily
    business:
      description: One-way sync of OPMS positions visible on registration into the BMS
        Positions list (fa1724a9); currently stopped.
      keywords: [positions, OPMS]
    logic:
      steps:
      - GET /positions -> filter visible_on_registration -> create missing Position rows
  auto_archived_files:
    display_name: Auto Achived files
    state: Stopped
    schedule: (was) On new file in IMS site, poll 5 min
    business:
      description: Auto-created archive folders for new files on the IMS SharePoint site;
        currently stopped.
      keywords: [archive, IMS, sharepoint]
    logic:
      steps: [New file trigger -> condition -> CreateNewFolder in IMS library]
  fdd_sub_render_pdf_v2:
    display_name: Copy of - FDD-Sub-RenderPDFV2(FormId)
    state: Stopped
    environment: BMS (8769c194)
    business:
      description: Child flow that renders an FDD form submission to PDF - Excel template
        + Office Script fill + OneDrive convert-to-PDF, including embedded images; currently
        stopped (copy of the production renderer).
      keywords: [FDD, PDF render, forms]
    logic:
      steps:
      - Manual (child-flow) trigger with FormId -> GetItem from FDD-FormInbox
      - Images extracted from form JSON, large images thumbnailed via OneDrive
      - FDD-RenderFormTemplate.xlsx filled by FDD-RenderForm.osts Office Script
      - OneDrive ConvertFile -> PDF -> saved back to BMS; temp Excel deleted
